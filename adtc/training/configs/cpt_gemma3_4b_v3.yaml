# Continued pre-training (CPT) v3 — Gemma 3 4B IT on on-disk Amharic CPT mix
# Stock tokenizer. Follow with merge → SFT on sft_mix_v3.
model_name_or_path: google/gemma-3-4b-it
output_dir: runs/gemma3_4b_cpt_v3

data_path: ../data/train/cpt_mix_v3.jsonl

seed: 42
max_seq_length: 2048
num_train_epochs: 1
per_device_train_batch_size: 1
gradient_accumulation_steps: 16
learning_rate: 1.0e-4
lr_scheduler_type: cosine
warmup_ratio: 0.03
logging_steps: 10
save_steps: 200
bf16: true
gradient_checkpointing: true
packing: true

load_in_4bit: true
bnb_4bit_compute_dtype: bfloat16
bnb_4bit_quant_type: nf4
bnb_4bit_use_double_quant: true

lora_r: 16
lora_alpha: 32
lora_dropout: 0.05
lora_target_modules:
  - q_proj
  - k_proj
  - v_proj
  - o_proj
  - gate_proj
  - up_proj
  - down_proj

report_to: none
