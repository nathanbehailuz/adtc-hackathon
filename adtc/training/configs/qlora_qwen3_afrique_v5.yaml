# SFT v5 QLoRA — qwen3_afrique on sft_mix_v5 (after CPT merge unless ablation)
model_name_or_path: runs/qwen3_afrique_cpt_merged_v5
output_dir: runs/qwen3_afrique_qlora_v5
data_path: ../data/train/sft_mix_v5.jsonl
model_class: auto

seed: 42
max_seq_length: 2048
num_train_epochs: 2
per_device_train_batch_size: 1
gradient_accumulation_steps: 16
learning_rate: 1.0e-4
lr_scheduler_type: cosine
warmup_ratio: 0.03
logging_steps: 10
save_steps: 200
bf16: true
gradient_checkpointing: true

load_in_4bit: true
bnb_4bit_compute_dtype: bfloat16
bnb_4bit_quant_type: nf4
bnb_4bit_use_double_quant: true

lora_r: 16
lora_alpha: 32
lora_dropout: 0.05
lora_target_modules:
  - q_proj
  - k_proj
  - v_proj
  - o_proj
  - gate_proj
  - up_proj
  - down_proj

report_to: none
