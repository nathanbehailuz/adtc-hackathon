# CPT v5 QLoRA — qwen3_afrique (incremental STEM/Amharic; not Afrique-scale CPT)
model_name_or_path: McGill-NLP/AfriqueQwen-4B
output_dir: runs/qwen3_afrique_cpt_v5
data_path: ../data/train/cpt_mix_v5.jsonl
model_class: auto

seed: 42
max_seq_length: 2048
num_train_epochs: 1
per_device_train_batch_size: 1
gradient_accumulation_steps: 16
learning_rate: 5.0e-5
lr_scheduler_type: cosine
warmup_ratio: 0.001
logging_steps: 10
save_steps: 200
bf16: true
gradient_checkpointing: true
packing: true

load_in_4bit: true
bnb_4bit_compute_dtype: bfloat16
bnb_4bit_quant_type: nf4
bnb_4bit_use_double_quant: true

lora_r: 16
lora_alpha: 32
lora_dropout: 0.05
lora_target_modules:
  - q_proj
  - k_proj
  - v_proj
  - o_proj
  - gate_proj
  - up_proj
  - down_proj

report_to: none
